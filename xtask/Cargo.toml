[package]
name = "xtask"
version = "0.0.0"
description = "Les gates de Shōgen (S-G1, S-G2, S-G3, volet mécanisable de S-G7) et l'outillage de passe."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

# ADR-0012 D3, seconde moitié : « dans `adapters/*` et `xtask/`, des plages
# semver ». L'ensemble vide de dépendances est ce qui reste le plus simple à
# auditer — la seule arête est interne au workspace.
[dependencies]
shogen-core = { path = "../crates/shogen-core", version = "=0.0.0" }
# Le harnais de fuzz (ADR-0011 seuil 7) éprouve la bibliothèque `no_std` du
# vérificateur, pas son binaire : `catch_unwind` est une capacité `std` et vit
# dans la coquille (xtask), jamais dans ce qui est éprouvé. L'arête va de
# `xtask` vers le vérificateur et JAMAIS l'inverse — le vérificateur reste à
# zéro dépendance tierce et à zéro dépendance de développement (ADR-0010
# point 3, ADR-0015 point 6, gate S-G2).
shogen-verifier = { path = "../crates/shogen-verifier", version = "=0.0.0" }
