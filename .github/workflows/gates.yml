# Gates VibeGates — Shogen, instanciation pilote (audit d'entrée du 2026-08-12).
# Référentiel : corpus « Compliance et ingénierie logicielle et architecturale », doc 02.
# Périmètre honnête : Shogen n'a pas encore de code produit (gate d'entrée « fondations
# d'ingénierie » en préparation, docs/12) et s2-harness est JETABLE (R-22, quarantaine
# déclarée dans son README). Le gate mécanisable réel aujourd'hui est G5 ; G3/G4/G6
# s'instancieront avec le premier code produit (voir docs/AUDIT-ENTREE.md).
# Invariant : jobs bloquants, jamais de continue-on-error.

name: gates
on:
  push:
    branches: [main]
  pull_request:

# Zéro autorité ambiante : le droit du jeton est DÉCLARÉ ici, jamais hérité d'un
# réglage de dépôt implicite (ADR-0012 D7 ; DEVOPS §4).
permissions:
  contents: read

jobs:
  g5-dette:
    name: g5-no-naked-todo
    runs-on: ubuntu-latest
    steps:
      # Épinglé par SHA de commit, jamais par tag (ADR-0013, point 5 : « la
      # version taguée d'une action est une page mutable »). SHA résolu le
      # 2026-08-12 par `gh api repos/actions/checkout/git/ref/tags/v4`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag v4.4.0
        with:
          persist-credentials: false
      - name: TODO/FIXME nus interdits (R-13)
        # Motif testé sur le dépôt réel avant instanciation (0 marqueur au 2026-08-12).
        # Exclusions : biblio/ (corpus de recherche), .claude/ (instructions d'agents),
        # ce workflow (fichier vérificateur).
        run: |
          if git grep -nE '\b(TODO|FIXME):' -- ':!biblio/' ':!.claude/' ':!.github/workflows/gates.yml'; then
            echo '::error::Marqueur TODO/FIXME nu. Registre de dette + ADR, ou résoudre (R-13).'
            exit 1
          fi
          echo "OK: aucun marqueur de dette nu."
