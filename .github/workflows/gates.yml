# Gates VibeGates — Shogen, instanciation pilote (audit d'entrée du 2026-08-12).
# Référentiel : corpus « Compliance et ingénierie logicielle et architecturale », doc 02.
# Périmètre (en-tête réécrit le 2026-09-29, lot CI-S2, ADR-0028 D6 (iii) ; g1 ajouté le
# 2026-09-30, lot D8a, g3 le même jour, lot D8b, et g5 élargi le même jour, lot D8c, ADR-0028
# D8) : ce workflow porte G5 (g5-no-naked-todo, R-13, avec les cas du hook pre-commit
# versionné), G1 (g1-model-pinning, R-1 : épinglage des modèles), le G3 des secrets
# (g3-secrets, plancher de motifs) et le G3 du chemin de recalcul S2
# (s2-harness-unittest) ; s2bis-unittest ajouté le 2026-10-04 (lot COLLECTE-BIS, CB-0 :
# paquet s2bis/ d'ADR-0029) ; sim-bis-unittest ajouté le 2026-10-05 (lot SIM-BIS, SB-0 :
# scripts/sim-bis/ d'ADR-0029 §6 lot 4). Les gates de forge du code Rust vivent dans squelette.yml,
# mutation.yml, fuzz.yml, reproductibilite.yml, compagnon.yml et temoignage.yml.
# s2-harness a deux périmètres (ADR-0028 D6 (i)) :
#   - chemin de recalcul : records (hors append_asn), window, r1, lm, r2 (hors
#     collect_asn), report et les points d'entrée recompute_*. Qualité produit,
#     sous G0-G7 complets (R-22) ;
#   - collecte : collector, sources, run_campaign, closure, smoke, journal, model,
#     r2.collect_asn et records.append_asn. Jetable, en quarantaine (campagne
#     scellée). Ses tests tournent dans le même job, sur fixtures.
# Invariant : jobs bloquants dans ce workflow, jamais de continue-on-error. Ils ne
# sont pas requis à la fusion : la protection de main n'a pas de
# required_status_checks (GC-09). La forge ne démarre plus les jobs (GC-01) : le G3
# opérant est l'oracle local, rejoué par l'orchestrateur (ADR-0028 D6 (iii), §4.11).
# Required check et premier run sur la forge : items SHOGEN-CI-S2-FORGE-1 (ADR-0028,
# annexe B.4), SHOGEN-G1-FORGE-1 (lot D8a), SHOGEN-G3-FORGE-1 (lot D8b) et
# SHOGEN-G5-FORGE-1 (lot D8c).

name: gates
on:
  push:
    branches: [main]
  pull_request:

# Zéro autorité ambiante : le droit du jeton est DÉCLARÉ ici, jamais hérité d'un
# réglage de dépôt implicite (ADR-0012 D7 ; DEVOPS §4).
permissions:
  contents: read

jobs:
  g5-dette:
    # Lot D8c (2026-09-30, ADR-0028 D8 ; G0 docs/adr-0028/G0-lot-D8c.md, journal
    # docs/G1-lot-D8c.md) : motif élargi (source adb2213, l.39 de son gates.yml) et cas du
    # hook pre-commit versionné (enforcement/hooks/), jumelle locale de ce job : même motif,
    # mêmes exclusions, octet pour octet (cas H-20). Aucune action ni installation nouvelle
    # (R-8) : bash, git et les outils de l'image (item SHOGEN-G5-FORGE-1 (c)). Identifiant
    # g5-dette et name inchangés : aucun required check n'existe (GC-09).
    name: g5-no-naked-todo
    # Image épinglée et checkout v7.0.1 : part de g5 dans SHOGEN-CI-RUNNERS-1, tirée en
    # avance par le lot D8c (le job porte désormais des tests).
    runs-on: ubuntu-24.04
    # Étapes mesurées en local (Git Bash, 2026-10-01) : 51 cas du hook en 93 à 98 s, balayage
    # de l'arbre en 68 à 78 ms ; 54 cas en 31 s (lot DETTES-B2, 2026-10-04, Linux de la session
    # cloud, charge moyenne 17 sur 4 cœurs). 10 min bornent un blocage sans couper un run normal.
    timeout-minutes: 10
    steps:
      # actions/checkout épinglé par SHA de commit (ADR-0013, point 5) : tag v7.0.1, le
      # SHA des autres jobs de ce workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1
        with:
          persist-credentials: false
      - name: cas du hook pre-commit versionné (dépôts jetables, commits réels)
        shell: bash
        run: bash enforcement/tests/run-fixtures-hooks.sh
      - name: TODO/FIXME nus interdits (R-13)
        # Motif élargi (lot D8c) : marqueur suivi de deux-points, ou introduit par un
        # délimiteur de commentaire ; 0 marqueur mesuré à 293b7a7 et à 40b4cfb (G0 du lot
        # D8c, §5.3). Exclusions : biblio/ (corpus de recherche), .claude/ (instructions
        # d'agents), ce workflow (fichier vérificateur). Code de git grep capté (lot DETTES-B2,
        # SHOGEN-G5-ERREUR-GREP-1) : 1 vert, 0 refus, tout autre code refus (un git grep en
        # erreur sortait en 0 par le if) ; cas H-24 du runner du hook.
        run: |
          g=0; git grep -nE '(\b(TODO|FIXME):|(//|#|--|;|/\*|\*|<!--)[[:space:]]*(TODO|FIXME)\b)' -- ':!biblio/' ':!.claude/' ':!.github/workflows/gates.yml' || g=$?
          case "$g" in
            1) echo "OK: aucun marqueur de dette nu." ;;
            0) echo '::error::Marqueur TODO/FIXME nu. Registre de dette + ADR, ou résoudre (R-13).'; exit 1 ;;
            *) echo "::error::git grep a échoué (code $g) ; échec fermé."; exit 1 ;;
          esac

  g1-model-pinning:
    # Lot D8a (2026-09-30, ADR-0028 D8, C-14 ; G0 docs/adr-0028/G0-lot-D8a.md, journal
    # docs/G1-lot-D8a.md) : épinglage des modèles en liste blanche exacte (R-1), sur le
    # frontmatter des agents, des skills et des commandes (tout .claude/ de l'arbre, hors
    # worktrees) et sur les réglages JSON de .claude/.
    # Étape 1 : les cas du lint, sur copies de fixtures dans des arbres mktemp ; étape 2 :
    # l'arbre du dépôt. Aucune action ni installation nouvelle (R-8) : bash et les outils
    # de l'image. awk de l'image (mawk, inféré, non mesuré), employé par le runner seul :
    # item SHOGEN-G1-FORGE-1 (c).
    # name: = identifiant du job, un seul nom pour le futur required check.
    name: g1-model-pinning
    # Image épinglée, comme s2-harness-unittest (GC-11 ; SHOGEN-CI-RUNNERS-1).
    runs-on: ubuntu-24.04
    # Étapes mesurées en local (Git Bash, 2026-09-30, après la revue G2) : 76 cas en 37 à
    # 47 s, arbre du dépôt en 0,7 à 0,9 s. 5 min bornent un blocage sans couper un run normal.
    timeout-minutes: 5
    steps:
      # actions/checkout épinglé par SHA de commit (ADR-0013, point 5) : tag v7.0.1, le
      # SHA du job s2-harness-unittest ci-dessous.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1
        with:
          persist-credentials: false
      - name: cas du lint d'épinglage (fixtures, arbres temporaires)
        shell: bash
        run: bash enforcement/tests/run-fixtures-model-pinning.sh
      - name: épinglage des modèles de l'arbre (liste blanche exacte, R-1)
        shell: bash
        run: bash enforcement/lint-model-pinning.sh .

  g3-secrets:
    # Lot D8b (2026-09-30, ADR-0028 D8 ; G0 docs/adr-0028/G0-lot-D8b.md, journal
    # docs/G1-lot-D8b.md) : gate G3 des secrets, plancher de motifs porté du blob 6789a30
    # (adb2213), sur les fichiers suivis et sur l'historique. Étape 1 : les cas de la gate, dans
    # des dépôts jetables mktemp, valeurs formées à l'exécution depuis des fragments tronqués ;
    # étape 2 : l'arbre du dépôt ; étape 3 : les lignes ajoutées de tout l'historique récupéré
    # (toutes les branches et tous les tags, --all). Aucune action ni installation nouvelle
    # (R-8) : bash, git et les outils de l'image (grep, awk, tr, mktemp, iconv : item
    # SHOGEN-G3-FORGE-1 (c)).
    # name: = identifiant du job, un seul nom pour le futur required check.
    name: g3-secrets
    # Image épinglée, comme les autres jobs (GC-11 ; SHOGEN-CI-RUNNERS-1).
    runs-on: ubuntu-24.04
    # Étapes mesurées en local (Git Bash) : 113 cas en 136 à 139 s (2026-10-01, re-revue rr1) ;
    # l'arbre du dépôt (302 à 304 fichiers, boucle par fichier du moteur porté) en 63 à 68 s et
    # l'historique (141 commits, --all) en 1,5 à 1,6 s (2026-09-30, après la revue G2) ; lot D8d
    # (2026-10-04, Linux de la session cloud, 4 cœurs) : 144 cas en 57 à 66 s sous une charge moyenne
    # de 17, 146 cas en 15 à 20 s sous une charge de 1 à 3 ; historique avec messages et objets des
    # refs (346 à 351 commits) en 2,4 à 5,5 s. 15 min bornent un blocage sans couper un run normal.
    timeout-minutes: 15
    steps:
      # actions/checkout épinglé par SHA de commit (ADR-0013, point 5) : tag v7.0.1, le
      # SHA des jobs g1-model-pinning et s2-harness-unittest. fetch-depth: 0 récupère tout
      # l'historique, branches et tags compris ; sans lui, un seul commit et la gate refuse
      # l'historique superficiel (SECRETS/tronque).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: cas de la gate des secrets (dépôts jetables, valeurs formées à l'exécution)
        shell: bash
        run: bash enforcement/tests/run-fixtures-secrets.sh
      - name: secrets des fichiers suivis (plancher de motifs, G3)
        shell: bash
        run: bash enforcement/gate-secrets.sh --tree
      - name: secrets de l'historique (lignes ajoutées, toutes les refs récupérées, G3)
        shell: bash
        run: bash enforcement/gate-secrets.sh --history

  s2-harness-unittest:
    # Lot CI-S2 (2026-09-29, ADR-0028 D6 (iii) ; cp-1 bref C-1..C-8) : la suite
    # unittest de s2-harness (bibliothèque standard seule, fixtures gelées), tests
    # du chemin de recalcul et de la collecte. La suite n'exige aucun réseau :
    # l'oracle local la rejoue sous garde réseau (0 tentative). Le job ne coupe pas
    # le réseau du runner (item SHOGEN-CI-S2-FORGE-1).
    # Sous-lot D8a-3 (2026-10-04, lot DETTES-B1 ; SHOGEN-CI-S2-SAUT-1, ADR-0028
    # annexe B.4) : le verdict porte sur la sortie de la suite, non plus sur le seul
    # code de sortie de unittest (enforcement/verdict-suite-s2.py : résumé final
    # exigé, sauts dont le motif nomme la variable scellée seuls admis, Ran ≥ plancher
    # committé) ; ses cas tournent avant la suite. Diff CB-18m (G2 de la tranche C de P1,
    # décision de l'orchestrateur) : --egal exige Ran = PLANCHER du vérificateur ; un
    # plancher oublié ou abaissé fait échouer le job (SHOGEN-CI-PLANCHER-SUIVI-1).
    # name: = identifiant du job, un seul nom pour le futur required check.
    name: s2-harness-unittest
    # Image épinglée : ubuntu-latest bascule vers Ubuntu 26 à partir du 2026-10-19
    # (annotation de forge, GC-11). Python de l'image : 3.12.3 au manifeste
    # runner-images Ubuntu2404-Readme (image 20260920.314.1, lu le 2026-09-29) ;
    # que python3 le désigne est inféré, la ligne python3 --version le mesure au
    # premier run.
    runs-on: ubuntu-24.04
    # Suite mesurée à moins de 10 s en local (188 tests, 2026-09-29) ; 398 tests en
    # 63 à 168 s dans le conteneur Linux du lot DETTES-B1 (2026-10-04), cas du
    # vérificateur en 1 à 2 s : 10 min bornent un blocage sans couper un run normal.
    timeout-minutes: 10
    steps:
      # actions/checkout épinglé par SHA de commit (ADR-0013, point 5) : tag v7.0.1,
      # le SHA de squelette.yml l.52-55 (résolu le 2026-08-12 par
      # `gh api repos/actions/checkout/tags` ; commit daté 2026-07-17T18:45:11Z).
      # Aucune action nouvelle, pas de setup-python (R-8) : l'interpréteur est
      # celui de l'image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1
        with:
          persist-credentials: false
      - name: cas du vérificateur de la suite (D8a-3, SHOGEN-CI-S2-SAUT-1)
        shell: bash
        run: python3 -B enforcement/tests/run-fixtures-verdict-suite-s2.py
      - name: suite unittest de s2-harness (fixtures, sans variable scellée), jugée par le vérificateur
        # shell: bash, soit bash --noprofile --norc -eo pipefail {0} (syntaxe des
        # workflows GitHub, table du mot-clé shell).
        # SHOGEN_S2_CAMPAGNE_CONTROL n'est pas posée par ce job, et unset la retire
        # si l'environnement la portait (le vérificateur la retire aussi de celui de
        # la suite) : sans elle, les deux tests nommés de test_exclusion, seuls
        # lecteurs du control.jsonl scellé (ADR-0028, annexe D.4 a), lèvent SkipTest.
        # Le vérificateur lance la suite avec -v (chaque test et le motif de chaque
        # saut), recopie sa sortie, puis juge résumé, sauts et compte.
        shell: bash
        run: |
          unset SHOGEN_S2_CAMPAGNE_CONTROL
          python3 --version
          python3 -B enforcement/verdict-suite-s2.py --egal

  s2bis-unittest:
    # Lot COLLECTE-BIS, sous-lot CB-0 (2026-10-04 ; ADR-0029 §2.9 ; G0 docs/adr-0029/g0-collecte/, PROPOSITION
    # §1 pt 6, E-C-40, E-C-41) : suite unittest du paquet s2bis/ (bibliothèque standard seule, fixtures, garde
    # réseau posée par s2bis/tests/__init__.py). Verdict par le vérificateur de s2-harness-unittest : résumé final
    # exigé, aucun saut admis, Ran ≥ plancher committé ci-dessous (SHOGEN-CI-S2-SAUT-1), relevé au compte mesuré à
    # chaque sous-lot (SHOGEN-CI-PLANCHER-SUIVI-1). Étapes lues par le cas K-02 du runner (SHOGEN-CI-S2-CABLAGE-1).
    # Diff CB-2e (Q-2 de la G2 de P1) : --egal exige Ran = plancher ; un plancher oublié ou abaissé fait échouer le job.
    name: s2bis-unittest
    # Image épinglée (SHOGEN-CI-RUNNERS-1) ; interpréteur de l'image, sans setup-python (R-8).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1
        with:
          persist-credentials: false
      - name: cas du vérificateur de la suite (câblage des deux jobs unittest compris)
        shell: bash
        run: python3 -B enforcement/tests/run-fixtures-verdict-suite-s2.py
      - name: suite unittest de s2bis (fixtures, garde réseau), jugée par le vérificateur, aucun saut admis
        shell: bash
        run: |
          python3 --version
          python3 -B enforcement/verdict-suite-s2.py s2bis --aucun-saut --egal --plancher 248

  sim-bis-unittest:
    # Lot SIM-BIS, sous-lot SB-0 (2026-10-05 ; ADR-0029 §6 lot 4 ; G0 docs/adr-0029/g0-sim/G0-SIM-BIS.md, PROPOSITION
    # Q-S-20 (a), adoptée par l'AVIS) : suite unittest de scripts/sim-bis (bibliothèque standard seule, données
    # synthétiques et sorties versées de PLAN-S2BIS). Verdict par le vérificateur des jobs unittest : résumé final exigé,
    # aucun saut admis, Ran = plancher committé ci-dessous (--egal), relevé au compte mesuré à chaque sous-lot ; étapes
    # lues par le cas K-03 du runner (SHOGEN-CI-S2-CABLAGE-1). Tant que la forge ne lance pas les jobs, le G3 opérant
    # lance cette ligne telle qu'écrite (SHOGEN-S2BIS-G3-LIGNE-JOB-1, étendue à ce job par Q-S-20). Sous-lot SB-14
    # (2026-10-05 ; E-S-01, E-S-39) : l'adaptateur oracle_r1 lit le harnais de f35a70c par git archive, d'où
    # l'historique complet (fetch-depth: 0, Q-T4-11) ; une copie sans ce commit échoue fermé (ORACLE/extraction).
    name: sim-bis-unittest
    # Image épinglée (SHOGEN-CI-RUNNERS-1) ; interpréteur de l'image, sans setup-python (R-8).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: cas du vérificateur de la suite (câblage des jobs unittest compris)
        shell: bash
        run: python3 -B enforcement/tests/run-fixtures-verdict-suite-s2.py
      - name: suite unittest de scripts/sim-bis, jugée par le vérificateur, aucun saut admis
        shell: bash
        run: |
          python3 --version
          python3 -B enforcement/verdict-suite-s2.py scripts/sim-bis --aucun-saut --egal --plancher 172
