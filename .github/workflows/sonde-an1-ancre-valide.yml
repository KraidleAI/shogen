name: sonde SONDE-AN1 ancre et alias de types valides
on:
  push:
    branches: [essai/analyseur-residus]
permissions: {}
jobs:
  s2bis-unittest:
    name: &n s2bis-unittest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: SONDE-AN1 pose du leurre python3 (aucun python ne tourne)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/leurre"
          echo '#!/bin/bash' > "$RUNNER_TEMP/leurre/python3"
          echo 'echo "SONDE-AN1 python3 recu :" "${@@Q}"' >> "$RUNNER_TEMP/leurre/python3"
          echo 'printf "%s|" "$@" | od -An -c | sed "s/^/SONDE-AN1 argv octets :/"' >> "$RUNNER_TEMP/leurre/python3"
          echo 's=$(xargs -0 -n1 < /proc/$PPID/cmdline | tail -n1)' >> "$RUNNER_TEMP/leurre/python3"
          echo 'echo "SONDE-AN1 script execute : $s"' >> "$RUNNER_TEMP/leurre/python3"
          echo 'sha256sum "$s" | sed "s/^/SONDE-AN1 script sha256 :/"' >> "$RUNNER_TEMP/leurre/python3"
          echo 'od -An -c "$s" | sed "s/^/SONDE-AN1 script octets :/"' >> "$RUNNER_TEMP/leurre/python3"
          echo 'exit 0' >> "$RUNNER_TEMP/leurre/python3"
          chmod +x "$RUNNER_TEMP/leurre/python3"
          echo "$RUNNER_TEMP/leurre" >> "$GITHUB_PATH"
          echo "SONDE-AN1 leurre pose"
      - name: SONDE-AN1 controle du leurre
        shell: bash
        run: |
          p=$(command -v python3)
          echo "SONDE-AN1 python3 resolu en $p"
          case "$p" in "$RUNNER_TEMP"/leurre/python3) ;; *) echo "SONDE-AN1 ARRET leurre absent"; exit 1 ;; esac
      - name: suite unittest de s2bis (fixtures, garde réseau), jugée par le vérificateur, aucun saut admis
        shell: bash
        run: |
          python3 --version
          python3 -B enforcement/verdict-suite-s2.py s2bis --aucun-saut --egal --plancher 341
      - name: *n
        shell: bash
        run: echo "SONDE-AN1 fin du job"
